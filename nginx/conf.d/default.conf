# ============================================================
# HTTP - 通过 Cloudflare Tunnel 接收流量
# Cloudflare 已完成 SSL 终止，nginx 接收的是 HTTP 内部流量
# ============================================================
server {
  listen 80;
  listen [::]:80;
  server_name _;

  # Cloudflare 健康检查（Tunnel 会定期探测）
  # 无需特殊配置，返回 200 即可

  # API → backend
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;  # Cloudflare → 用户端始终是 HTTPS
    proxy_read_timeout 86400;
  }

  # Uploaded files → backend
  location /uploads/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
  }

  # Everything else → frontend (Next.js)
  location / {
    proxy_pass http://frontend:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 86400;
  }
}
