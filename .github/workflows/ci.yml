name: CI/CD

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/haplotes405/myblog-backend
  FRONTEND_IMAGE: ghcr.io/haplotes405/myblog-frontend

jobs:
  # ============================================================
  # Job 1: Type-check & build (lightweight, no Docker)
  # ============================================================
  verify:
    name: Verify (Build + TypeCheck)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        project: [backend, frontend]
    defaults:
      run:
        working-directory: ./${{ matrix.project }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript compile
        if: matrix.project == 'backend'
        run: npm run build

      - name: Next.js build
        if: matrix.project == 'frontend'
        run: npm run build

  # ============================================================
  # Job 2: Build & push Docker images (master only)
  # ============================================================
  docker:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: verify
    if: github.ref == 'refs/heads/master'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ---- Backend ----
      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:latest
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ---- Frontend ----
      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.FRONTEND_IMAGE }}:latest
            ${{ env.FRONTEND_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ============================================================
  # Job 3: Deploy to ECS (master only)
  # ============================================================
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: docker
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          script: |
            set -e
            echo "=== Wiki Deploy — $(date '+%Y-%m-%d %H:%M:%S') ==="
            cd /opt/wiki

            # Ensure deepseek.key exists (for DeepSeek AI API)
            if [ -n "${{ secrets.DEEPSEEK_API_KEY }}" ]; then
              echo "${{ secrets.DEEPSEEK_API_KEY }}" > /opt/wiki/deepseek.key
              chmod 600 /opt/wiki/deepseek.key
              echo "[✓] deepseek.key written"
            else
              echo "[!] DEEPSEEK_API_KEY secret not set — AI features will not work"
            fi

            # Login to GHCR (optional — skip if GHCR_PAT not set)
            if [ -n "${{ secrets.GHCR_PAT }}" ]; then
              echo "[*] Logging in to GHCR..."
              echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
              echo "[✓] Logged in"
            fi

            # Pull latest images
            echo "[*] Pulling images..."
            docker compose -f docker-compose.prod.yml pull

            # Recreate backend to pick up new deepseek.key mount
            echo "[*] Recreating backend..."
            docker compose -f docker-compose.prod.yml up -d --force-recreate backend

            # Start remaining services
            echo "[*] Starting services..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # Health check
            echo "[*] Waiting for backend..."
            for i in $(seq 1 15); do
              if docker compose -f docker-compose.prod.yml ps backend 2>/dev/null | grep -q 'healthy'; then
                echo "[✓] Backend healthy!"
                break
              fi
              sleep 3
            done

            # Verify cloudflared tunnel
            echo "[*] Checking Cloudflare Tunnel..."
            if docker compose -f docker-compose.prod.yml ps cloudflared 2>/dev/null | grep -q 'Up'; then
              echo "[✓] Cloudflare Tunnel running"
            else
              echo "[!] Cloudflare Tunnel may not be running — check logs"
            fi

            # Status
            echo ""
            docker compose -f docker-compose.prod.yml ps

            # Cleanup
            docker image prune -f
            echo "=== Deploy complete! ==="

  # ============================================================
  # Job 4: Result summary
  # ============================================================
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [verify, docker, deploy]
    if: always()
    steps:
      - name: CI passed
        if: needs.verify.result == 'success'
        run: echo "✅ Verify passed"

      - name: Docker pushed
        if: needs.docker.result == 'success'
        run: echo "🐳 Docker images pushed to ${{ env.REGISTRY }}"

      - name: Deploy status
        if: needs.deploy.result == 'success'
        run: echo "🚀 Deployed to ECS"
      - name: Deploy skipped or failed
        if: needs.deploy.result != 'success'
        run: |
          if [ "${{ needs.deploy.result }}" = "skipped" ]; then
            echo "⏭️ Deploy skipped (non-master branch)"
          else
            echo "❌ Deploy failed — check logs"
          fi

      - name: Full pipeline passed
        if: needs.docker.result == 'success'
        run: |
          echo ""
          echo "============================================"
          echo "  Images published:"
          echo "  ${{ env.BACKEND_IMAGE }}:latest"
          echo "  ${{ env.FRONTEND_IMAGE }}:latest"
          echo "============================================"
