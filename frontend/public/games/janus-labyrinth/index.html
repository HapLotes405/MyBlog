<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>雅努斯迷津 — Janus Labyrinth</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #0a0f19;
            font-family: Arial, "Microsoft YaHei", "PingFang SC", sans-serif;
            touch-action: none;
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            user-select: none;
        }
        #game-container {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #game-container canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        /* Mobile control hint */
        .mobile-hint {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255,255,255,0.5);
            font-size: 12px;
            pointer-events: none;
            z-index: 100;
            text-align: center;
        }
        @media (min-width: 1024px) {
            .mobile-hint { display: none; }
        }
    </style>
</head>
<body>
    <div id="game-container"></div>
    <div class="mobile-hint">👆 按住屏幕旋转迷宫，松手恢复</div>

    <!-- Phaser 3.60 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
    <!-- Game script -->
    <script src="game.js"></script>
</body>
</html>
