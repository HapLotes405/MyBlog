# ===== Production Docker Compose =====
# 使用 GHCR 预构建镜像，无需本地构建
#
# 部署步骤：
#   1. 将此文件 + .env + nginx/ 复制到服务器
#   2. 生成 SSL 证书（Let's Encrypt 或自签名）
#   3. docker compose -f docker-compose.prod.yml pull
#   4. docker compose -f docker-compose.prod.yml up -d
#
# 更新步骤：
#   1. docker compose -f docker-compose.prod.yml pull
#   2. docker compose -f docker-compose.prod.yml up -d

services:
  db:
    image: postgres:16-alpine
    container_name: wiki-db
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      POSTGRES_DB: ${DB_NAME:-wiki}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup:/backup
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ghcr.io/haplotes405/myblog-backend:latest
    container_name: wiki-backend
    # Backend 不对外暴露端口，仅通过 nginx 访问（如需调试可临时解注释）
    # ports:
    #   - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    environment:
      PORT: "8000"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme}@db:5432/${DB_NAME:-wiki}
      UPLOAD_DIR: ./uploads
      BLOGGER_EMAIL: ${BLOGGER_EMAIL:-admin@hapLotes405.wiki}
      BLOGGER_PASSWORD: ${BLOGGER_PASSWORD:-changeme}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:8000/api/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/haplotes405/myblog-frontend:latest
    container_name: wiki-frontend
    # Frontend 不对外暴露端口，仅通过 nginx 访问
    # ports:
    #   - "127.0.0.1:3000:3000"
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # Nginx 反向代理 —— 对外唯一入口
  # ============================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: wiki-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/www:/var/www/certbot
      - nginx_logs:/var/log/nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # 自动备份服务（每日凌晨3点备份 PostgreSQL）
  # ============================================================
  backup:
    image: alpine:latest
    container_name: wiki-backup
    volumes:
      - ./backup:/backup
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_DB: ${DB_NAME:-wiki}
      PGPASSWORD: ${DB_PASSWORD:-changeme}
    command: |
      sh -c '
        apk add --no-cache postgresql-client gzip dcron
        echo "0 3 * * * pg_dump -h db -U $$POSTGRES_USER -d $$POSTGRES_DB --no-owner --no-acl | gzip > /backup/wiki_backup_\$$(date +\%Y\%m\%d_\%H\%M\%S).sql.gz && find /backup -name \"wiki_backup_*.sql.gz\" -mtime +7 -delete" > /etc/crontabs/root
        echo "[Backup] Scheduled daily at 3:00 AM"
        crond -f -l 2
      '
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  pgdata:
  uploads:
  nginx_logs:
